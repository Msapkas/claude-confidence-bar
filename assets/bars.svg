    <rect x="28" y="45.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="45.0" width="22" height="20.0" rx="3" fill="#d29922"/>
    <rect x="28" y="67.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="67.0" width="22" height="20.0" rx="3" fill="#d29922"/>
    <text x="64" y="44.0" fill="#d29922" font-weight="700">64.5%→</text>
    <line x1="128" y1="44.0" x2="168" y2="44.0" stroke="#484f58" stroke-width="1.5"/>
    <rect x="168" y="3" width="568" height="82" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="184" y="33.0" class="note">fix written, not yet tested</text>
    <text x="184" y="55.0" class="dim">💭 running the parser tests next</text>
    <text x="722" y="33.0" class="tag" text-anchor="end">fast mode</text>
    </g>
  <g transform="translate(0 208)">
    <rect x="28" y="1.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="23.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="45.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="47.5" width="22" height="17.5" rx="3" fill="#f85149"/>
    <text x="64" y="33.0" fill="#f85149" font-weight="700">31%↓</text>
    <line x1="128" y1="33.0" x2="168" y2="33.0" stroke="#484f58" stroke-width="1.5"/>
    <rect x="168" y="3" width="568" height="60" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="184" y="33.0" class="note">assumption broke, rethinking</text>
    <text x="722" y="33.0" class="tag" text-anchor="end">guessing</text>

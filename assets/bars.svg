    <rect x="168" y="3" width="568" height="60" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="184" y="33.0" class="note">tests pass, behaviour checked</text>
    <text x="722" y="33.0" class="tag" text-anchor="end">verified</text>
    </g>
  <g transform="translate(0 104)">
    <rect x="28" y="1.0" width="22" height="20" rx="3" fill="#21262d"/>
    <rect x="28" y="23.0" width="22" height="20" rx="3" fill="#21262d"/>

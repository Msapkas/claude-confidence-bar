<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-label="The vertical confidence bar: green at 92%, yellow at 64.5% in fast mode with a live thought line, red at 31%, and dimmed after a new message">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; dominant-baseline: middle; }
    .note { fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .tag { fill: #6e7681; font-size: 12px; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="377" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g transform="translate(0 22)">
    <rect x="28" y="1.0" width="22" height="20" rx="3" fill="#21262d"/>
